name: Fix Filter Dropdown Overflow

on:
  push:
    paths:
      - '.github/workflows/fix-filter-dropdown-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI Sentia
        uses: actions/checkout@v4

      - name: Fix dropdown and timeframe overflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Fix dropdown clipping while preserving horizontal scrolling when closed.
          old = '<div class="flex flex-nowrap items-center gap-3 overflow-x-auto pb-2">'
          new = '''<div class="filter-dropdown-row flex flex-nowrap items-center gap-3 pb-2" :class="openDropdown ? 'overflow-visible' : 'overflow-x-auto'">'''

          if old in text:
              text = text.replace(old, new, 1)
              print('Applied dropdown overflow fix.')
          elif "filter-dropdown-row" in text and "openDropdown ? 'overflow-visible'" in text:
              print('Dropdown overflow fix already present.')
          else:
              raise SystemExit('Expected filter row markup was not found; refusing to modify index.html.')

          # Remove the timeframe helper because it creates a visual overflow/scroll area
          # inside the filter panel when any timeframe > 24h is selected. The selected
          # timeframe itself is already explicit in the control, so this helper is redundant.
          helper = '''                <!-- Helper Text (shown for > 24h) - positioned below, wraps in 2 lines -->
                 <div x-show="timeframe > 24" x-cloak x-transition 
                  class="absolute top-full left-0 mt-1 text-[9px] text-gray-500 italic max-w-[16rem] leading-tight" 
                  x-text="uiText.timeframe_helper"></div>
'''

          if helper in text:
              text = text.replace(helper, '', 1)
              print('Removed timeframe helper overflow.')
          elif 'x-text="uiText.timeframe_helper"' not in text:
              print('Timeframe helper already absent.')
          else:
              raise SystemExit('Timeframe helper markup was found in an unexpected format; refusing to modify index.html.')

          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name 'AI Sentia Bot'
          git config user.email 'bot@aipulse.ai'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove timeframe helper overflow'
          git push origin main
