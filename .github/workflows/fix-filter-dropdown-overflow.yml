name: Fix Filter Dropdown Overflow

on:
  push:
    paths:
      - '.github/workflows/fix-filter-dropdown-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI Sentia
        uses: actions/checkout@v4

      - name: Fix dropdown clipping
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '<div class="flex flex-nowrap items-center gap-3 overflow-x-auto pb-2">'
          new = '''<div class="filter-dropdown-row flex flex-nowrap items-center gap-3 pb-2" :class="openDropdown ? 'overflow-visible' : 'overflow-x-auto'">'''

          if old not in text:
              if "filter-dropdown-row" in text and "openDropdown ? 'overflow-visible'" in text:
                  print('Dropdown overflow fix already present; nothing to do.')
              else:
                  raise SystemExit('Expected filter row markup was not found; refusing to modify index.html.')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Applied dropdown overflow fix.')

      - name: Commit fix
        run: |
          git config user.name 'AI Sentia Bot'
          git config user.email 'bot@aipulse.ai'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix filter dropdown clipping'
          git push origin main
