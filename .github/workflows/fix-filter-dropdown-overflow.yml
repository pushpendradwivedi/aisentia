name: Fix Filter Dropdown Overflow

on:
  push:
    paths:
      - '.github/workflows/fix-filter-dropdown-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI Sentia
        uses: actions/checkout@v4

      - name: Fix timeframe overflow directly in index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Keep the dropdown fix already deployed.
          old = '<div class="flex flex-nowrap items-center gap-3 overflow-x-auto pb-2">'
          new = '''<div class="filter-dropdown-row flex flex-nowrap items-center gap-3 pb-2" :class="openDropdown ? 'overflow-visible' : 'overflow-x-auto'">'''
          if old in text:
              text = text.replace(old, new, 1)

          # Remove ANY version of the timeframe helper block. This is intentionally
          # regex-based so formatting changes cannot leave the helper behind.
          pattern = r'\s*<!-- Helper Text \(shown for > 24h\).*?</div>'
          text, removed = re.subn(pattern, '', text, count=1, flags=re.S)
          if removed:
              print('Removed timeframe helper block.')

          # Also remove an orphan helper div if the HTML comment was changed/removed.
          pattern2 = r'\s*<div[^>]*x-text=["\']uiText\.timeframe_helper["\'][^>]*></div>'
          text, removed2 = re.subn(pattern2, '', text, count=1, flags=re.S)
          if removed2:
              print('Removed orphan timeframe helper.')

          # Make the filter panel a fixed-height single-row control area. The cards
          # below remain the only vertically scrollable page content.
          css = '''\n<style id="timeframe-overflow-fix">\n.filter-dropdown-row { position: relative; overflow-y: visible !important; }\n.filter-dropdown-row:not(:has([x-show*=\"openDropdown\"])) { overflow-y: visible !important; }\n</style>\n'''
          if 'id="timeframe-overflow-fix"' not in text:
              text = text.replace('</head>', css + '</head>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name 'AI Sentia Bot'
          git config user.email 'bot@aipulse.ai'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix timeframe filter overflow'
          git push origin main
