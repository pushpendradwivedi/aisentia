name: Fix Filter Dropdown Overflow

on:
  push:
    paths:
      - '.github/workflows/fix-filter-dropdown-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI Sentia
        uses: actions/checkout@v4

      - name: Fix dropdown and timeframe helper layout
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Keep the filter row horizontally scrollable when closed, but let
          # open dropdown menus escape the row.
          old = '<div class="flex flex-nowrap items-center gap-3 overflow-x-auto pb-2">'
          new = '''<div class="filter-dropdown-row flex flex-nowrap items-center gap-3 pb-2" :class="openDropdown ? 'overflow-visible' : 'overflow-x-auto'">'''
          if old in text:
              text = text.replace(old, new, 1)
              print('Applied dropdown overflow fix.')

          # Remove any helper left by previous versions.
          text = re.sub(
              r'\s*<!-- Helper Text \(shown for > 24h\).*?</div>',
              '', text, count=1, flags=re.S
          )
          text = re.sub(
              r'\s*<div[^>]*x-text=["\']uiText\.timeframe_helper["\'][^>]*></div>',
              '', text, count=1
          )

          # Restore the guidance AFTER the scrollable filter row has closed.
          # It therefore remains visible without creating a scrollbar in the row.
          marker = '''                </select>\n            </div>\n\n        </div>\n    </div>\n\n    <!-- Loading State (CLS-safe skeleton layout) -->'''
          helper = '''                </select>\n            </div>\n\n        </div>\n\n        <div x-show="timeframe > 24" x-cloak x-transition\n            class="mt-1 px-1 text-[10px] text-gray-500 italic leading-tight"\n            x-text="uiText.timeframe_helper"></div>\n    </div>\n\n    <!-- Loading State (CLS-safe skeleton layout) -->'''

          if marker not in text:
              raise SystemExit('Expected timeframe/filter panel boundary was not found; refusing to modify index.html.')
          text = text.replace(marker, helper, 1)

          path.write_text(text, encoding='utf-8')
          print('Timeframe guidance restored outside the scrollable row.')

      - name: Commit fix
        run: |
          git config user.name 'AI Sentia Bot'
          git config user.email 'bot@aipulse.ai'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore timeframe scroll guidance outside filter overflow'
          git push origin main
